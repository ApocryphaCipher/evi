[project]
name = "evi"
version = "0.1.0"
description = "Evidence store and catalogue for software forensics: keep originals, extract text, link claims to evidence"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pypdf>=5",
    "striprtf>=0.0.26",
]

[project.optional-dependencies]
ui = ["datasette>=0.65"]

[project.scripts]
evi = "evi.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.20"]
build-backend = "uv_build"
